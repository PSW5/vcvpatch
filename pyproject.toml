[project]
name = "vcvpatch"
version = "0.1.0"
description = "Read, write, inspect and validate VCV Rack 2 .vcv patch files - Python library, CLI and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ping-Sheng Wu" }]
keywords = ["vcv-rack", "modular-synth", "mcp", "zstd"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "zstandard>=0.22",
  "mcp>=2,<3",
]

[project.scripts]
vcvpatch = "vcvpatch.cli:main"

[project.urls]
Repository = "https://github.com/PSW5/vcvpatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcvpatch"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
